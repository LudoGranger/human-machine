name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "skills/**", "docs/**", "scripts/install.mjs", "scripts/package-site.py", "manifest.json", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site (no collected data, no secrets)
        run: |
          python3 scripts/package-site.py
          mkdir -p _site/docs
          cp site/index.html site/style.css site/app.js site/skill-data.js site/human-machine-skills.zip _site/
          cp -R site/assets _site/assets
          cp docs/*.md _site/docs/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
